plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.tune2ai.studio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tune2ai.studio'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    // Play Protect blocks sideloaded apps that request SMS or notification access (fraud protection,
    // e.g. in India). "standard" leaves those out so it installs from a browser or file manager;
    // "full" adds SMS, call history, and app notifications for installs through adb.
    flavorDimensions = ['access']
    productFlavors {
        standard {
            dimension 'access'
        }
        full {
            dimension 'access'
            versionNameSuffix '-full'
        }
    }
}

dependencies {
    implementation project(':sdk-llama')
    implementation project(':sdk-remote')

    testImplementation libs.junit
    testImplementation libs.orgjson // decision D9: real org.json for JVM tests
}
