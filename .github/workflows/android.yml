name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Reply renderer tests
        run: node app/src/test/js/markdown.test.js
      - name: Build and test
        run: ./gradlew :sdk:assembleRelease :sdk:testDebugUnitTest :sdk-remote:testDebugUnitTest :sdk-llama:assembleRelease :app:testStandardDebugUnitTest :app:assembleDebug
      # standard: installs from a browser or file manager (no SMS, call log, or notification access).
      - name: Upload Studio APK (standard)
        uses: actions/upload-artifact@v4
        with:
          name: tune2ai-studio-standard-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
      # full: adds SMS, call history, and app notifications; Play Protect blocks it unless installed with adb.
      - name: Upload Studio APK (full, install with adb)
        uses: actions/upload-artifact@v4
        with:
          name: tune2ai-studio-full-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
